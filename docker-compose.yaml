services:
  userdb:
    container_name: user_db
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
      MONGO_INITDB_DATABASE: user-db
    ports:
      - "27017:27017"
    volumes:
      - userdb_data:/data/db
    networks:
      - capstone
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username ${USERNAME} --password ${PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user-svc:
    container_name: user_svc
    build:
      context: ./userSerivce
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://${USERNAME}:${PASSWORD}@userdb:27017/user-db/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${USER_PORT}
      BREVO_API_KEY: ${BREVO_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
      SENDER_NAME: ${SENDER_NAME}
    ports:
      - "3000:3000"
    depends_on:
      userdb:
        condition: service_healthy
    networks:
    - capstone
  
  cakedb:
    container_name: cake_db
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
      MONGO_INITDB_DATABASE: cake-db
    ports:
      - "27018:27017"
    volumes:
      - cakedb_data:/data/db
    networks:
      - capstone
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username ${USERNAME} --password ${PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cake-svc:
    container_name: cake_svc
    build:
      context: ./cakeCatalog
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://${USERNAME}:${PASSWORD}@cakedb:27017/cake-db/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PORT: ${CAKE_PORT}
    ports:
      - "3001:3001"
    depends_on:
      cakedb:
        condition: service_healthy
    networks:
    - capstone

  orderdb:
    container_name: order_db
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
      MONGO_INITDB_DATABASE: order-db
    ports:
      - "27019:27017"
    volumes:
      - orderdb_data:/data/db
    networks:
      - capstone
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username ${USERNAME} --password ${PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  order-svc:
    container_name: order_svc
    build:
      context: ./orderService
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://${USERNAME}:${PASSWORD}@orderdb:27017/order-db/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CAKE_SVC_URL: ${CAKE_URL}
      PORT: ${ORDER_PORT}
    ports:
      - "3002:3002"
    depends_on:
      orderdb:
        condition: service_healthy
    networks:
    - capstone

  ratingdb:
    container_name: rating_db
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD}
      MONGO_INITDB_DATABASE: rating-db
    ports:
      - "27020:27017"
    volumes:
      - ratingdb_data:/data/db
    networks:
      - capstone
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username ${USERNAME} --password ${PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rating-svc:
    container_name: rating_svc
    build:
      context: ./ratingService
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://${USERNAME}:${PASSWORD}@ratingdb:27017/rating-db/?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ORDER_SVC_URL: ${ORDER_URL}
      PORT: ${RATING_PORT}
    ports:
      - "3003:3003"
    depends_on:
      ratingdb:
        condition: service_healthy
    networks:
    - capstone
  
  gateway:
    container_name: gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      USER_URL: ${USER_URL}
      CAKE_URL: ${CAKE_URL}
      ORDER_URL: ${ORDER_URL}
      RATING_URL: ${RATING_URL}
    ports:
      - "8080:8080"
    networks:
    - capstone
  
  kafka:
    container_name: kafka_container
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - capstone

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    networks:
      - capstone
  
  kafka-svc:
    container_name: kafka_svc
    build:
      context: ./kafkaSvc
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - capstone
  
  notification-svc:
    container_name: notify_svc
    build:
      context: ./notificationService
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      BREVO_API_KEY: ${BREVO_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
      SENDER_NAME: ${SENDER_NAME}
      PORT: ${NOTIFY_PORT}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-svc:
        condition: service_started
    ports:
      - "3004:3004"
    networks:
      - capstone

  frontend:
    container_name: frontend_svc
    build:
      context: ./bakehouse-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    networks:
      - capstone
    
volumes:
  userdb_data:
  cakedb_data:
  orderdb_data:
  ratingdb_data:
  kafka_data:
  
networks:
  capstone:
