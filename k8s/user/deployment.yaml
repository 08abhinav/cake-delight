apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user-svc
          image: ataksuki/user-svc:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-secret