apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification-svc
          image: ataksuki/notification-svc:latest
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret