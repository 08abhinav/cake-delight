apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order-svc
          image: ataksuki/order-svc:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret