apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rating
  template:
    metadata:
      labels:
        app: rating
    spec:
      containers:
        - name: rating-svc
          image: ataksuki/rating-svc:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: rating-config
            - secretRef:
                name: rating-secret